name: test-templates
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { dir: [cloudflare-paywall, nextjs, telegram-bot] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund paidonchain && npm test
        working-directory: ${{ matrix.dir }}
